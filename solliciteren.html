<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solliciteren - HetIsRoan Studio's</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="dark-mode">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="logo.png" alt="HetIsRoan Logo" class="logo-img">
                <span class="logo-text">HetIsRoan Studio's</span>
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="over.html">Over Ons</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Aanvragen</a></li>
                <li class="join-team-nav" style="display: none;"><a href="solliciteren.html" class="active">Join Het
                        Team</a></li>
                <li class="admin-link-item" style="display: none;"><a href="admin.html">Admin</a></li>
                <li><button id="theme-toggle" class="btn-theme">☀️ Light</button></li>
            </ul>
        </div>
    </nav>

    <main class="container page-content">
        <div class="card form-card">
            <h2>Join HetIsRoan Studio's</h2>
            <p style="margin-bottom: 25px; color: var(--text-secondary);">Wil jij meehelpen aan vette webprojecten? Vul
                onderstaand formulier in!</p>

            <form id="apply-form">
                <div class="form-group">
                    <label for="apply-name">Naam / Nickname *</label>
                    <input type="text" id="apply-name" required placeholder="Jouw naam">
                </div>

                <div class="form-group">
                    <label for="apply-email">E-mailadres / Discord Contact *</label>
                    <input type="text" id="apply-email" required placeholder="bijv. DiscordTag#0000 of e-mail">
                </div>

                <div class="form-group">
                    <label>Jouw Vaardigheden (vink aan wat van toepassing is) *</label>
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                        <label><input type="checkbox" name="skills" value="HTML/CSS"> HTML5 / CSS3 Design</label>
                        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript Logica</label>
                        <label><input type="checkbox" name="skills" value="UI/UX Design"> UI/UX Design</label>
                        <label><input type="checkbox" name="skills" value="Support & Testing"> Testing & Support</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="apply-experience">Motivatie & Ervaring *</label>
                    <textarea id="apply-experience" rows="4" required
                        placeholder="Vertel kort over jezelf en ervaringen met bouwen/ontwerpen..."></textarea>
                </div>

                <div class="form-group">
                    <label for="apply-code">Link naar eerdere werken of GitHub (Optioneel)</label>
                    <input type="text" id="apply-code" placeholder="https://github.com/...">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Sollicitatie
                    Versturen</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; HetIsRoan Studio's. Alle rechten voorbehouden.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
